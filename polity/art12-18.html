<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundamental Rights: Articles 12–18 | MCQ Practice</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--muted:#66727f;--line:#dde2e8;--accent:#2f5d8a;--green:#1e8449;--gbg:#e6f4ec;--red:#c0392b;--rbg:#fbeaea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Georgia,"Times New Roman",serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-family:system-ui,sans-serif;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;font-family:system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--accent);transition:width .2s}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-family:system-ui,sans-serif;font-size:.85rem;padding:8px 12px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.jump button{width:38px;height:36px;padding:0}
.jump .c{background:var(--gbg);border-color:var(--green);color:var(--green)}
.jump .w{background:var(--rbg);border-color:var(--red);color:var(--red)}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;scroll-margin-top:10px}
.qn{font-family:system-ui,sans-serif;font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.qt{margin:4px 0 6px}
.st{margin:0 0 10px;padding-left:22px}.st li{margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.95rem}
.opt:hover{background:#f1f4f8}
.opt.locked{cursor:default}.opt.locked:hover{background:inherit}
.opt input{margin-top:4px}
.opt.correct{background:var(--gbg);border-color:var(--green)}
.opt.wrong{background:var(--rbg);border-color:var(--red)}
.opt.locked.correct:hover{background:var(--gbg)}.opt.locked.wrong:hover{background:var(--rbg)}
.fb{margin-top:12px;padding:12px;border-radius:8px;font-family:system-ui,sans-serif;font-size:.92rem}
.fb.ok{background:var(--gbg);border-left:4px solid var(--green)}
.fb.no{background:var(--rbg);border-left:4px solid var(--red)}
.fb.rev{background:#eef2f7;border-left:4px solid var(--accent)}
.fb strong{display:block;margin-bottom:4px}
.res h2{margin:0 0 8px;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{background:var(--rbg);border-color:var(--red);color:var(--red)}
.hidden{display:none}
@media(max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.q{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fundamental Rights: Articles 12–18</h1>
  <p class="sub">BPSC Prelims MCQ Practice · Select an option to get instant feedback</p>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
      <div class="stat"><b id="sAtt">0</b><span>Attempted</span></div>
      <div class="stat"><b id="sCor" style="color:var(--green)">0</b><span>Correct</span></div>
      <div class="stat"><b id="sInc" style="color:var(--red)">0</b><span>Incorrect</span></div>
      <div class="stat"><b id="sAcc">0%</b><span>Accuracy</span></div>
    </div>
    <div class="bar"><div id="bar"></div></div>
  </div>

  <div class="panel">
    <div class="btns">
      <button id="bShow">Show All Answers</button>
      <button id="bHide">Hide All Answers</button>
      <button id="bRetry" disabled>Retry Incorrect Questions</button>
      <button id="bReview" disabled>Review Incorrect</button>
      <button id="bAll" class="hidden">Show All Questions</button>
      <button id="bReset">Reset Test</button>
    </div>
    <div style="margin-top:12px;font-size:.8rem;color:var(--muted)">Jump to question</div>
    <div class="jump" id="jump"></div>
  </div>

  <div id="results" class="panel res hidden"></div>
  <div id="list"></div>
</div>

<script>
// ===== QUESTION BANK — replace this array for another topic =====
// Fields: q (stem), s (optional statements), o (4 options), a (correct index 0-3 = A-D), e (explanation)
const QUESTIONS = [
{q:"With reference to Article 12 of the Constitution, consider the following:",
 s:["The Parliament and State Legislatures are included in the definition of State.","Local authorities are included in the definition of State.","Private individuals acting entirely in their personal capacity are automatically covered by Article 12."],
 o:["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],a:1,
 e:"Article 12 includes the Government and Parliament of India, State Governments and Legislatures, local authorities and other authorities within the territory of India or under the control of the Government of India. Private individuals acting entirely in their personal capacity are not automatically State under Article 12."},
{q:"Consider the following statements regarding Article 13:",
 s:["Pre-Constitution laws inconsistent with Fundamental Rights are void to the extent of inconsistency.","Every pre-Constitution law inconsistent with Fundamental Rights is automatically void in its entirety.","Article 13 provides a constitutional basis for judicial review."],
 o:["1 and 3 only","2 only","1 and 2 only","1, 2 and 3"],a:0,
 e:"Article 13 makes inconsistent laws void only to the extent of inconsistency. It does not necessarily invalidate the entire law. Article 13 is an important constitutional basis for judicial review."},
{q:"With reference to Article 14, consider the following statements:",
 s:["Equality before law is a British constitutional concept.","Equal protection of laws is associated with the American Constitution.","Article 14 permits reasonable classification.","Article 14 prohibits all forms of classification by the State."],
 o:["1 and 2 only","1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4"],a:1,
 e:"Article 14 permits reasonable classification subject to intelligible differentia and rational nexus. It prohibits arbitrary discrimination, not every classification."},
{q:"The doctrine of reasonable classification under Article 14 requires:",
 s:["Intelligible differentia.","Rational nexus between classification and the objective of the law.","Identical treatment of all individuals irrespective of circumstances."],
 o:["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],a:1,
 e:"Reasonable classification requires intelligible differentia and rational nexus. Identical treatment irrespective of circumstances is not required."},
{q:"Consider the following grounds: 1. Religion  2. Race  3. Caste  4. Residence  5. Place of birth  6. Sex. Which of the above are expressly mentioned in Article 15(1)?",
 o:["1, 2, 3 and 6 only","1, 2, 3, 5 and 6 only","1, 2, 3, 4, 5 and 6","2, 3, 4 and 5 only"],a:1,
 e:"Article 15(1) prohibits discrimination on grounds only of religion, race, caste, sex or place of birth. Residence is not expressly mentioned."},
{q:"Which of the following statements regarding Article 15 are correct?",
 s:["Article 15(3) permits special provisions for women and children.","Article 15(4) permits special provisions for socially and educationally backward classes, SCs and STs.","Article 15(5) excludes minority educational institutions protected under Article 30(1).","Article 15(6) enables special provisions for Economically Weaker Sections."],
 o:["1 and 2 only","1, 2 and 3 only","1, 2, 3 and 4","2 and 4 only"],a:2,
 e:"All four statements are correct. Article 15 contains enabling provisions for affirmative action and EWS-related special provisions."},
{q:"Which of the following Constitutional Amendments inserted Article 15(4)?",
 o:["First Constitutional Amendment Act, 1951","Seventh Constitutional Amendment Act, 1956","Forty-second Constitutional Amendment Act, 1976","Ninety-third Constitutional Amendment Act, 2005"],a:0,
 e:"Article 15(4) was inserted by the First Constitutional Amendment Act, 1951, following the Supreme Court judgment in State of Madras v. Champakam Dorairajan."},
{q:"With reference to Article 15(5), consider the following:",
 s:["It permits special provisions relating to admission in educational institutions.","It applies to private aided educational institutions.","It applies to private unaided educational institutions.","It applies to minority educational institutions under Article 30(1)."],
 o:["1 and 2 only","1, 2 and 3 only","1, 2, 3 and 4","2 and 4 only"],a:1,
 e:"Article 15(5) applies to government and private aided/unaided educational institutions but excludes minority educational institutions under Article 30(1)."},
{q:"Consider the following statements about Article 16:",
 s:["It guarantees equality of opportunity in public employment.","It is available to Indian citizens.","Article 16(4) enables reservation for backward classes inadequately represented in State services.","Article 16 applies equally to private-sector employment."],
 o:["1 and 2 only","1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4"],a:1,
 e:"Article 16 concerns equality of opportunity in public employment under the State. It does not generally govern private-sector employment."},
{q:"Which of the following pairs is/are correctly matched?",
 s:["Article 16(4A) — Reservation in promotion for SCs and STs","Article 16(4B) — Carry-forward of unfilled reserved vacancies","Article 16(6) — EWS reservation in public employment"],
 o:["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],a:3,
 e:"All three are correctly matched. Article 16(4B) allows backlog reserved vacancies to be treated separately from current-year vacancies for determining the 50% ceiling."},
{q:"Article 16(4B) was inserted by which Constitutional Amendment?",
 o:["77th Amendment","81st Amendment","85th Amendment","93rd Amendment"],a:1,
 e:"The 81st Constitutional Amendment Act, 2000, inserted Article 16(4B) to provide for carry-forward of unfilled reserved vacancies."},
{q:"With reference to Article 17, consider the following statements:",
 s:["Untouchability is abolished in all forms.","Enforcement of disabilities arising from untouchability is punishable by law.","Article 17 applies only to discrimination by the State."],
 o:["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],a:1,
 e:"Article 17 abolishes untouchability and makes its enforcement punishable. Its operation is not limited exclusively to State action; it also addresses private practices."},
{q:"The Protection of Civil Rights Act, 1955, was originally known as:",
 o:["Scheduled Castes Protection Act","Untouchability (Offences) Act","Equality Protection Act","Civil Liberties Act"],a:1,
 e:"The legislation was originally called the Untouchability (Offences) Act, 1955, and was renamed the Protection of Civil Rights Act."},
{q:"Consider the following statements regarding Article 18:",
 s:["The State cannot confer titles except military or academic distinctions.","Indian citizens cannot accept titles from foreign States.","Bharat Ratna and Padma Awards are unconstitutional.","National awards cannot be used as prefixes or suffixes to names."],
 o:["1 and 2 only","1, 2 and 4 only","2, 3 and 4 only","1, 2, 3 and 4"],a:1,
 e:"Bharat Ratna and Padma Awards are constitutionally permissible if they are not used as titles or prefixes/suffixes."},
{q:"Which of the following rights are available exclusively to Indian citizens?",
 s:["Article 14 — Equality before law","Article 15 — Prohibition of discrimination","Article 16 — Equality of opportunity in public employment","Article 19 — Freedom of speech and other freedoms"],
 o:["1 and 2 only","2, 3 and 4 only","1, 2, 3 and 4","1, 3 and 4 only"],a:1,
 e:"Articles 15, 16 and 19 are citizen-specific. Article 14 is available to all persons, including foreigners."}
];
// ===== END QUESTION BANK =====

const L = ["A","B","C","D"];
let answers, revealed, filtered;
const $ = id => document.getElementById(id);

function init(){
  answers = QUESTIONS.map(()=>null);
  revealed = QUESTIONS.map(()=>false);
  filtered = false;
  render();
}
function isWrong(i){ return answers[i]!==null && answers[i]!==QUESTIONS[i].a; }

function render(){
  const list = $("list"); let html = "";
  QUESTIONS.forEach((Q,i)=>{
    const sel = answers[i], done = sel!==null, rev = revealed[i] && !done;
    if(filtered && !isWrong(i)) return;
    html += `<div class="q" id="q${i}"><div class="qn">Question ${i+1} of ${QUESTIONS.length}</div><p class="qt">${Q.q}</p>`;
    if(Q.s) html += `<ol class="st">${Q.s.map(t=>`<li>${t}</li>`).join("")}</ol>`;
    Q.o.forEach((t,j)=>{
      let c = "opt";
      if(done||rev){
        if(done) c += " locked";
        if(j===Q.a) c += " correct";
        else if(done && j===sel) c += " wrong";
      }
      html += `<label class="${c}"><input type="radio" name="q${i}" value="${j}" data-q="${i}" ${done?"disabled":""} ${sel===j?"checked":""}><span><b>${L[j]}.</b> ${t}</span></label>`;
    });
    if(done){
      const ok = sel===Q.a;
      html += `<div class="fb ${ok?"ok":"no"}"><strong>${ok?"✓ Correct!":"✗ Incorrect — correct answer: "+L[Q.a]}</strong>${Q.e}</div>`;
    } else if(rev){
      html += `<div class="fb rev"><strong>Answer: ${L[Q.a]}</strong>${Q.e}</div>`;
    }
    html += `</div>`;
  });
  if(!html) html = `<div class="panel">No incorrect questions to show.</div>`;
  list.innerHTML = html;
  updateStats(); updateJump(); updateResults();
}

function updateStats(){
  const total = QUESTIONS.length;
  const att = answers.filter(a=>a!==null).length;
  const cor = answers.filter((a,i)=>a!==null && a===QUESTIONS[i].a).length;
  const inc = att-cor;
  $("sTotal").textContent = total; $("sAtt").textContent = att;
  $("sCor").textContent = cor; $("sInc").textContent = inc;
  $("sAcc").textContent = (att? Math.round(cor/att*100):0)+"%";
  $("bar").style.width = (att/total*100)+"%";
  $("bRetry").disabled = inc===0;
  $("bReview").disabled = inc===0;
  $("bAll").classList.toggle("hidden", !filtered);
}

function updateJump(){
  $("jump").innerHTML = QUESTIONS.map((Q,i)=>{
    const a = answers[i];
    const c = a===null ? "" : (a===Q.a ? "c" : "w");
    return `<button class="${c}" data-j="${i}" title="Question ${i+1}">${i+1}</button>`;
  }).join("");
}

function updateResults(){
  const box = $("results");
  const att = answers.filter(a=>a!==null).length;
  if(att!==QUESTIONS.length){ box.classList.add("hidden"); box.innerHTML=""; return; }
  const wrong = QUESTIONS.map((_,i)=>i).filter(isWrong);
  const cor = QUESTIONS.length - wrong.length;
  const acc = Math.round(cor/QUESTIONS.length*100);
  box.classList.remove("hidden");
  box.innerHTML = `<h2>Test Complete</h2>
    <div><b>Score:</b> ${cor} / ${QUESTIONS.length} &nbsp; <b>Accuracy:</b> ${acc}%</div>
    <div style="margin-top:8px"><b>Incorrect questions:</b> ${wrong.length? wrong.map(i=>i+1).join(", ") : "None — perfect score!"}</div>
    ${wrong.length? `<div class="chips">${wrong.map(i=>`<button data-j="${i}">Q${i+1}</button>`).join("")}</div>
    <div class="btns"><button class="primary" id="rReview">Review Incorrect Questions</button><button id="rRetry">Retry Incorrect Questions</button></div>` : ""}
    <div class="btns" style="margin-top:8px"><button id="rReset">Reset Test</button></div>`;
}

function goTo(i){
  if(filtered && !isWrong(i)){ filtered=false; render(); }
  const el = $("q"+i);
  if(el) el.scrollIntoView({behavior:"auto",block:"start"});
}

function reviewIncorrect(){
  if(!answers.some((a,i)=>isWrong(i))) return;
  filtered = true; render(); window.scrollTo(0,0);
}
function retryIncorrect(){
  QUESTIONS.forEach((_,i)=>{ if(isWrong(i)){ answers[i]=null; revealed[i]=false; } });
  filtered = false; render();
  const first = answers.findIndex(a=>a===null);
  if(first>=0) goTo(first);
}

// Event handling
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.matches('input[type=radio][data-q]')){
    const i = +t.dataset.q;
    if(answers[i]!==null) return;      // locked
    answers[i] = +t.value;
    revealed[i] = false;
    render();
  }
});
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.j!==undefined) return goTo(+b.dataset.j);
  switch(b.id){
    case "bShow": revealed = revealed.map(()=>true); render(); break;
    case "bHide": revealed = revealed.map(()=>false); render(); break;
    case "bReset": case "rReset": window.scrollTo(0,0); init(); break;
    case "bRetry": case "rRetry": retryIncorrect(); break;
    case "bReview": case "rReview": reviewIncorrect(); break;
    case "bAll": filtered=false; render(); break;
  }
});
init();
</script>
</body>
</html>
